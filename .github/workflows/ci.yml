name: Verify Salem
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Core suite only: exercises POSIX-only paths. UI, distribution and packaging stay Windows-only.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run test:distribution
        env:
          SALEM_WINDOWS_RUNTIME_SMOKE: '1'
      - name: Package Windows
        run: npm run package:windows -- --out-dir .artifacts/ci-windows
      - name: Install packaged application in isolation
        shell: pwsh
        run: |
          $env:SALEM_WINDOWS_SETUP = (Get-ChildItem -LiteralPath .artifacts/ci-windows -Filter '*-Setup.exe').FullName
          if (-not $env:SALEM_WINDOWS_SETUP) { throw 'Missing Windows installer' }
          node --test tests/windows-package.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: salem-windows-evidence
          path: |
            .artifacts/ci-windows/*.exe
            .artifacts/ci-windows/*.zip
            .artifacts/ci-windows/*.json
            .artifacts/ci-windows/*.txt
            test-results/
          if-no-files-found: ignore
          retention-days: 7
